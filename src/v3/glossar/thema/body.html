{assign var="glossarPage" value=""}
{foreach from=$breadlinks item=bl}
	{if $bl->field.type == "v3/glossar"}{assign var="glossarPage" value=$bl}{/if}
{/foreach}

<article class="bg-primary rounded-3xl shadow-sm p-6 lg:p-8 max-w-3xl">
	{if $glossarPage}
	<a href="{page_url page=$glossarPage}" class="inline-flex items-center gap-2 text-sm text-secondary hover:text-primary mb-4">
		<svg class="size-4 fill-secondary rotate-180 shrink-0"><use xlink:href="#icon-next"></use></svg>
		Zurück zum Glossar
	</a>
	{/if}
	<h1 class="text-2xl xl:text-3xl font-bold title-font mb-4">{$page->field.title}</h1>
	{if $page->field.content}
	<div class="content-block text-base leading-relaxed">
		{$page->field.content}
	</div>
	{/if}
</article>
